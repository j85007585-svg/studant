name: Search and Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract
        run: |
          sudo apt-get update && sudo apt-get install -y unrar
          find . -name "*.rar" -exec unrar x -o+ {} . \;

      - name: Locate and Build
        run: |
          # البحث عن مكان وجود ملف gradlew الحقيقي
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          
          cd "$PROJECT_ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
