name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Unrar
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar

      - name: Force Extract and Move
        run: |
          # فك ضغط كل شيء
          unrar x app.rar || true
          # نقل الملفات من المجلد الفرعي للمجلد الرئيسي ليراها Gradle
          cp -r app/* . || true
          chmod +x gradlew

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-snake-game
          path: "**/build/outputs/apk/debug/*.apk"
