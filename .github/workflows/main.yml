name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Unrar
        run: sudo apt-get update && sudo apt-get install -y unrar

      - name: Global File Extraction and Cleanup
        run: |
          # فك الضغط في المجلد الرئيسي
          unrar x -o+ app.rar || true
          
          # سحب كل ملفات المشروع من المجلدات الفرعية (مثل studant أو app) للواجهة
          find . -maxdepth 3 -name "gradlew" -exec cp {} . \;
          find . -maxdepth 3 -name "settings.gradle*" -exec cp {} . \;
          find . -maxdepth 3 -name "build.gradle*" -exec cp {} . \;
          find . -maxdepth 3 -name "gradle" -type d -exec cp -r {} . \;
          
          # التأكد من وجود ملف settings.gradle لربط المجلدات
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "include(':app')" > settings.gradle.kts
          fi
          
          chmod +x gradlew

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-debug
          path: "**/build/outputs/apk/debug/*.apk"
