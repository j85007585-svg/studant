name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Unrar
        run: sudo apt-get update && sudo apt-get install -y unrar

      - name: Fix Directory Structure
        run: |
          # 1. فك ضغط أي ملف مضغوط موجود
          find . -name "*.rar" -exec unrar x -o+ {} . \;
          
          # 2. نقل ملفات Gradle للواجهة إذا كانت داخل مجلدات (مثل studant أو app)
          find . -maxdepth 3 -name "gradlew" -exec cp {} . \;
          find . -maxdepth 3 -name "settings.gradle*" -exec cp {} . \;
          find . -maxdepth 3 -name "build.gradle*" -exec cp {} . \;
          find . -maxdepth 3 -name "gradle" -type d -exec cp -r {} . \;
          
          # 3. التأكد من صلاحيات التشغيل
          chmod +x gradlew || true

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-output
          path: "**/build/outputs/apk/debug/*.apk"
