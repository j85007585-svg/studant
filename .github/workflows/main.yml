name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Unrar
        run: sudo apt-get update && sudo apt-get install -y unrar

      - name: Force Clean and Structure
        run: |
          # 1. فك ضغط أي ملف rar موجود
          find . -name "*.rar" -exec unrar x -o+ {} . \;
          
          # 2. البحث عن ملفات التشغيل ونقلها للمكان الصحيح غصباً عنها
          find . -name "gradlew" -exec cp {} . \;
          find . -name "settings.gradle*" -exec cp {} . \;
          find . -name "build.gradle*" -exec cp {} . \;
          find . -name "gradle.properties" -exec cp {} . \;
          find . -name "gradle" -type d -exec cp -r {} . \;
          
          # 3. التأكد من وجود ملف settings لربط المشروع
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "include(':app')" > settings.gradle.kts
          fi
          
          chmod +x gradlew || true

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-game-apk
          path: "**/build/outputs/apk/debug/*.apk"
