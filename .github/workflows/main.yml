name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Unrar
        run: sudo apt-get update && sudo apt-get install -y unrar

      - name: Comprehensive Extraction and Fix
        run: |
          # فك ضغط أي ملف rar في أي مكان
          find . -name "*.rar" -exec unrar x -o+ {} . \;
          
          # البحث عن ملفات Gradle في كل المستويات ونقلها للمجلد الرئيسي
          find . -name "gradlew" -exec cp {} . \;
          find . -name "settings.gradle*" -exec cp {} . \;
          find . -name "build.gradle*" -exec cp {} . \;
          find . -name "gradle.properties" -exec cp {} . \;
          find . -name "gradle" -type d -exec cp -r {} . \;
          
          # إصلاح صلاحيات الملفات
          chmod +x gradlew || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK with Force
        run: |
          # محاولة البناء مع تجاهل الأخطاء غير القاتلة
          ./gradlew assembleDebug --no-daemon --stacktrace
          
      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-complete
          path: "**/build/outputs/apk/debug/*.apk"
